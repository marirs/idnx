name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/idnx"
          ARCHIVE_NAME="idnx-${{ matrix.target }}.tar.gz"
          tar -czf "dist/${ARCHIVE_NAME}" -C "$(dirname ${BIN_PATH})" idnx
          cd dist
          shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
        shell: bash

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          $binPath = "target/${{ matrix.target }}/release/idnx.exe"
          $archiveName = "idnx-${{ matrix.target }}.zip"
          Compress-Archive -Path $binPath -DestinationPath "dist/$archiveName"
          Get-FileHash "dist/$archiveName" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $archiveName" } | Out-File "dist/$archiveName.sha256"
        shell: pwsh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idnx-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: Flatten release artifacts
        run: |
          mkdir -p release-assets
          find all-dist -type f -exec mv -t release-assets {} +
          ls -lh release-assets

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
