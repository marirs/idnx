[package]
name = "idnx"
version = "0.1.0"
edition = "2024"
authors = ["Sriram <marirs@gmail.com>"]
description = "Fast, asynchronous network identification and deep infrastructure exploration library."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/marirs/idnx"
keywords = ["network", "scanner", "lldp", "topology", "discovery"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "idnx"
path = "src/lib.rs"

[[bin]]
name = "idnx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
colored = "3.0"
ipnet = "2.11"
indicatif = "0.17"
get_if_addrs = "0.5"
comfy-table = "7.1"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
quick-xml = { version = "0.37", features = ["serialize"] }
csv = "1.3"
chrono = "0.4"
