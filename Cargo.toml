[package]
name = "idnx"
version = "0.3.1"
edition = "2024"
authors = ["Sriram <marirs@gmail.com>"]
description = "Fast, asynchronous network identification and deep infrastructure exploration library."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/marirs/idnx"
keywords = ["network", "scanner", "lldp", "topology", "discovery"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "idnx"
path = "src/lib.rs"

[[bin]]
name = "idnx"
path = "src/main.rs"

[features]
# Multi-vantage federation. Off by default: an unapproved subsystem should not be part of
# the shipped build, and keeping it out means changes to the core evidence model cannot be
# forced through it to keep compiling.
default = []
federation = ["dep:ed25519-dalek", "dep:x25519-dalek", "dep:chacha20poly1305", "dep:hkdf", "dep:sha2", "dep:rand_core"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
colored = "3.0"
ipnet = "2.11"
indicatif = "0.17"
# `link-local` is not a default feature, and without it fe80::/10 addresses are omitted
# entirely -- which silently left every interface with no IPv6 source to bind to, so every
# IPv6 probe failed locally before a packet was sent.
if-addrs = { version = "0.15", features = ["link-local"] }
comfy-table = "7.1"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
quick-xml = { version = "0.37", features = ["serialize"] }
csv = "1.3"
chrono = "0.4"
macaddr-ouidb = "0.1.11"
ed25519-dalek = { optional = true, version = "2.2", default-features = false, features = ["rand_core", "std"] }
rand_core = { optional = true, version = "0.6", features = ["getrandom"] }
x25519-dalek = { optional = true, version = "2.0", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1
