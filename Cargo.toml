[package]
name = "idnx"
version = "0.3.0"
edition = "2024"
authors = ["Sriram <marirs@gmail.com>"]
description = "Fast, asynchronous network identification and deep infrastructure exploration library."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/marirs/idnx"
keywords = ["network", "scanner", "lldp", "topology", "discovery"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "idnx"
path = "src/lib.rs"

[[bin]]
name = "idnx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
colored = "3.0"
ipnet = "2.11"
indicatif = "0.17"
if-addrs = "0.15"
comfy-table = "7.1"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
quick-xml = { version = "0.37", features = ["serialize"] }
csv = "1.3"
chrono = "0.4"
macaddr-ouidb = "0.1.11"

[profile.release]
# Measured on this crate rather than carried over from another project. The previous
# settings arrived with a comment about Typst, which idNX does not use.
#
# opt-level = 3 against opt-level = "z", macOS arm64, same lto/codegen-units:
#   OUI lookup, 200k addresses     32-56 ms   vs   48-73 ms
#   frame decode, 500k frames     417-438 ms  vs  483-491 ms
#   stripped binary                 3.3 MB    vs    2.4 MB
#
# On a real run the difference is around a millisecond: a privileged scan decodes a few
# thousand frames and resolves a couple of dozen OUIs, and the wall clock is dominated by
# network timeouts measured in seconds. Neither setting is therefore latency-relevant.
# 3 is kept anyway because the hot paths here are decode and parse loops, and 850 KB is a
# cheap price for not trading their throughput away; "z" would be the right choice only if
# binary size were a constraint, which for a CLI of this size it is not.
opt-level = 3
# Debug symbols are not shipped; a backtrace from a release binary is not the support
# channel for this tool.
strip = true
# Cross-crate inlining across the decoder and graph paths, which are split over many small
# functions. Worth the compile time on a crate this size.
lto = "fat"
codegen-units = 1
